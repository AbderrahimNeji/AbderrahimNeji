<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Abderrahim Neji — Software and Data Engineering</title>
  <desc id="desc">Midnight Intelligence banner with name and discipline.</desc>
  <defs>
