<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Abderrahim Neji — Software and Data Engineering</title>
  <desc id="desc">Midnight Intelligence banner: name, discipline, and abstract neural connections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#151D35"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#42D9F5"/>
      <stop offset="100%" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="glowC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42D9F5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#42D9F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowV" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#42D9F5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#42D9F5" stop-opacity="0"/>
